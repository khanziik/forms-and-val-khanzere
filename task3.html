
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 Bootstrap validation styles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">

        <h1>Task 3: Bootstrap validation styles</h1>

        <form class="needs-validation" novalidate>
            <div class="mb-3">

                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
                <div class="invalid-feedback"> Name is required </div>
                <div class="valid-feedback"> looks good!</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="invalid-feedback">enter a valid email</div>
                <div class="valid-feedback">looks good!</div>

            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" required minlength="30"></textarea>
                <div class="invalid-feedback">enter a message with at least 30 characters</div>
                <div class="valid-feedback">looks good!</div>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <p  class="mt-3">
            <a  href="index.html">Back to tasks</a>
        </p>
    </div>


    <script src="task3.js"></script>
</body>
</html>
