<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1  HTML5 validation</title>
</head>

<body>

    <h1>Task 1: Form with HTML5 validation</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required maxlength="20">
        <br> <br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br> <br>

        <label  for="message">Message:</label>
        <textarea id="message" name="message"  required maxlength="30"></textarea>
        <br><br>

        <button type="submit">Submit</button>
    </form>
    <p><a href="index.html">Back to tasks</a></p>
</body>

</html>
